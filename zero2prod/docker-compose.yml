services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      network: host               # keeps your build working
    image: zero2prod
    container_name: zero2prod_app
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: password
      DB_NAME: newsletter
      APP_PORT: 8000
      APP_RUN_MIGRATIONS: "true"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8000/health_check"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  db:
    image: postgres:16            # ← Changed from alpine to full Debian-based
    container_name: zero2prod_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: newsletter
    ports:
      - "5433:5432"               # optional, for local psql access
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 5s
      timeout: 5s
      retries: 10                 # increased retries for slower first-start
      start_period: 20s           # give more time for init

volumes:
  pgdata:
