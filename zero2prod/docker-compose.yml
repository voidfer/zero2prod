services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      network: host
    image: zero2prod
    container_name: zero2prod_app
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      APP_PORT: ${APP_PORT}
      APP_RUN_MIGRATIONS: "true"
      # Point the app to the Docker-internal WireMock service
      EMAIL_BASE_URL: http://email:8080
    depends_on:
      db:
        condition: service_healthy
      email:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8000/health_check"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    extra_hosts:
      - "host.docker.internal:host-gateway"

  db:
    image: postgres:16
    container_name: zero2prod_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${DB_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s

  email:
    image: wiremock/wiremock:2.35.0
    container_name: zero2prod_email
    ports:
      - "8001:8080"  # Host 8001 → Container 8080
    volumes:
      - ./wiremock:/home/wiremock  # optional: if you have stubs/mappings
    restart: unless-stopped

volumes:
  pgdata:
